$schema: 'https://moonrepo.dev/schemas/project.json'
language: typescript
tasks:
  dev:
    command: 'bun run dev'
  build:
    command: 'bun run build'
  build-watch:
    command: 'bun run build:watch'
  typecheck:
    command: 'bun run typecheck'
  typecheck-watch:
    command: 'bun run typecheck:watch'
  lint:
    command: 'bun run lint'
  lint-fix:
    command: 'bun run lint:fix'
  format:
    command: 'bun run format'
  test:
    command: 'bun run test'
  test-watch:
    command: 'bun run test:watch'
  test-coverage:
    command: 'bun run test:coverage'
  scan:
    command: 'bun run scan'
  check:
    command: 'bun run check'
  verify:
    command: 'bun run verify'
  dev-docs:
    command: 'bun run dev:docs'
  build-docs:
    command: 'bun run build:docs'
  preview-docs:
    command: 'bun run preview:docs'
  clean:
    command: 'bun run clean'
  deps-analyze:
    command: 'bun run deps:analyze'
